<style>
:root { --bg:#f0f4f8; --card:#fff; --tx:#1e293b; --mu:#64748b; --bd:#e2e8f0; --ac:#0a8fc4; --ac2:#e0f2fe; --pr:#059669; --dn:#dc2626; --dnb:#fee2e2; --sh:0 8px 24px rgba(0,0,0,.08); --radius:16px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f172a; --card:#1e293b; --tx:#f8fafc; --mu:#94a3b8; --bd:#334155; --ac:#38bdf8; --ac2:#0c4a6e; --pr:#10b981; --dn:#f87171; --dnb:#7f1d1d; --sh:0 8px 24px rgba(0,0,0,.4); } }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:var(--bg); color:var(--tx); font-family:-apple-system,"Vazirmatn","Segoe UI",Tahoma,sans-serif; font-size:14px; padding-bottom:80px; padding-top:env(safe-area-inset-top); }
header { position:sticky; top:0; z-index:10; background:var(--bg); padding:12px; box-shadow:0 2px 10px rgba(0,0,0,.05); }
h1 { font-size:18px; margin:0 0 12px; display:flex; justify-content:space-between; align-items:center; font-weight:800; color:var(--ac);}
h1 span { font-size:12px; background:var(--bd); color:var(--tx); padding:4px 10px; border-radius:10px; cursor:pointer; }
.tabs { display:flex; gap:6px; margin-bottom:10px; background:var(--card); padding:5px; border-radius:12px; border:1px solid var(--bd); }
.tab { flex:1; padding:10px; border:none; border-radius:8px; font-weight:700; background:transparent; color:var(--mu); font-size:13px; transition:.2s; }
.tab.on { background:var(--ac); color:#fff; box-shadow:0 4px 10px rgba(10,143,196,.3); }
.row { display:flex; gap:8px; margin-bottom:8px; }
input,select,button,textarea { font-family:inherit; font-size:13px; padding:10px 12px; border-radius:10px; border:1px solid var(--bd); width:100%; outline:none; background:var(--card); color:var(--tx);}
input:focus, select:focus, textarea:focus { border-color:var(--ac); box-shadow:0 0 0 3px var(--ac2); }
button { cursor:pointer; font-weight:bold; border:none; transition:.2s;}
button:active { transform:scale(0.97); }
.btn-icon { background:var(--ac); color:#fff; width:auto; padding:10px 14px; font-size:16px; border-radius:10px; }

/* Floating Action Button */
.fab { position:fixed; bottom:24px; left:24px; width:56px; height:56px; border-radius:50%; background:var(--ac); color:#fff; font-size:28px; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 20px rgba(10,143,196,.4); z-index:20; cursor:pointer; border:none; transition:.3s;}
.fab:active { transform:scale(0.9); }

#list { padding:12px; display:grid; gap:14px; }
.c { background:var(--card); border-radius:var(--radius); padding:16px; box-shadow:var(--sh); border:1px solid var(--bd); position:relative; overflow:hidden;}
.c::before { content:""; position:absolute; top:0; right:0; width:100%; height:4px; background:var(--ac); }
.cat { font-size:11px; color:var(--ac); background:var(--ac2); padding:3px 10px; border-radius:8px; font-weight:800; display:inline-block;}
.nm { font-size:16px; font-weight:800; margin:12px 0 6px; line-height:1.4;}
.cd { font-size:11px; color:var(--mu); font-family:monospace; direction:ltr; text-align:right; margin-bottom:6px;}
.pr { font-size:20px; font-weight:900; color:var(--pr); margin-top:12px; display:flex; align-items:baseline; gap:6px;}
.pr small { font-size:12px; color:var(--mu); font-weight:600; }
.np { color:var(--dn); background:var(--dnb); font-weight:800; padding:6px 12px; border-radius:8px; display:inline-block; margin-top:12px; font-size:13px; }
.ln { font-size:13px; color:var(--mu); margin-top:8px; display:flex; align-items:center; gap:6px; line-height:1.6;}
.ln a { color:var(--ac); text-decoration:none; font-weight:700;}
.nt { font-size:12px; background:var(--bg); padding:10px; border-radius:8px; margin-top:10px; color:var(--tx); border-right:3px solid var(--ac); line-height:1.7;}
.sp { font-size:13px; background:var(--bg); padding:10px; border-radius:8px; margin-top:10px; color:var(--tx); line-height:1.8;}
.bs { display:flex; gap:6px; margin-top:14px; flex-wrap:wrap;}
.bt { flex:1; padding:8px; font-size:12px; background:var(--bg); border:1px solid var(--bd); border-radius:8px; color:var(--tx); font-weight:700; min-width:60px;}
.bt.p { background:var(--ac); color:#fff; border:none; }
.bt.d { background:var(--dnb); color:var(--dn); border:none; }

/* Modal */
.modal { position:fixed; inset:0; background:rgba(15,23,42,.8); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(5px); }
.modal.hide { display:none; }
.modal .card { background:var(--card); width:100%; max-width:450px; border-radius:20px; padding:20px; display:grid; gap:12px; box-shadow:0 10px 40px rgba(0,0,0,.5); max-height:90vh; overflow-y:auto;}
.modal h3 { margin:0 0 10px; font-size:18px; text-align:center; font-weight:800;}
.modal label { font-size:12px; font-weight:700; color:var(--mu); margin-bottom:-6px;}
.modal textarea { min-height:80px; resize:vertical; }
.photos { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
.photos img { width:60px; height:60px; object-fit:cover; border-radius:8px; border:1px solid var(--bd); }
.photos .del { position:absolute; top:-5px; right:-5px; background:var(--dn); color:#fff; border-radius:50%; width:18px; height:18px; font-size:10px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.p-wrap { position:relative; display:inline-block;}

#toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px); background:#1e293b; color:#fff; padding:12px 24px; border-radius:30px; font-size:13px; opacity:0; transition:.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index:100; pointer-events:none; font-weight:bold; box-shadow:0 8px 20px rgba(0,0,0,.2);}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

<header>
  <h1>💧 ویزیتوری پایس <span id="st" title="دانلود بکاپ">💾 بکاپ</span></h1>
  <div class="tabs">
    <button class="tab on" id="tp">کالاها</button>
    <button class="tab" id="tl">مغازه‌ها</button>
  </div>
  <div class="row">
    <input id="q" type="search" placeholder="جستجو...">
    <button class="btn-icon" id="temp" title="دانلود قالب اکسل">📄</button>
    <button class="btn-icon" id="imp" title="آپلود اکسل">📥</button>
  </div>
  <div class="row">
    <select id="cat"><option value="">همه دسته‌ها</option></select>
    <select id="city" class="hide" style="display:none;"><option value="">همه شهرها</option></select>
  </div>
</header>

<button class="fab" id="ad">+</button>
<input type="file" id="fcsv" accept=".csv" hidden>
<input type="file" id="fimg" accept="image/*" hidden>

<!-- Modal: Add/Edit -->
<div id="modal-add" class="modal hide">
  <div class="card">
    <h3 id="m-title">افزودن جدید</h3>
    <input id="m-id" type="hidden">
    <div id="p-fields">
      <label>نام کالا *</label><input id="m-n" placeholder="نام">
      <label>دسته بندی *</label><input id="m-c" placeholder="دسته">
      <label>قیمت (تومان)</label><input id="m-pr" placeholder="قیمت" inputmode="numeric">
      <label>مشخصات</label><textarea id="m-sp" placeholder="مشخصات فنی..."></textarea>
      <label>توضیحات</label><textarea id="m-nt" placeholder="توضیحات..."></textarea>
    </div>
    <div id="s-fields" style="display:none;">
      <label>نام مغازه *</label><input id="s-n" placeholder="نام">
      <label>شهر *</label><input id="s-city" placeholder="شهر">
      <label>آدرس</label><input id="s-addr" placeholder="آدرس">
      <label>تلفن</label><input id="s-ph" placeholder="تلفن" inputmode="tel">
      <label>وضعیت</label><select id="s-st"><option>جدید</option><option>ویزیت‌شده</option><option>مشتری شد</option><option>رد شد</option></select>
      <label>یادآوری (تاریخ و ساعت)</label><input id="s-rem" type="datetime-local">
    </div>
    <div class="bs" style="margin-top:16px;">
      <button class="bt p" onclick="saveItem()">ذخیره</button>
      <button class="bt" onclick="document.getElementById('modal-add').classList.add('hide')">انصراف</button>
    </div>
  </div>
</div>

// ================= منطق =================
const fa="۰۱۲۳۴۵۶۷۸۹"; const toFa=s=>String(s).replace(/\d/g,d=>fa[d]);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=p=>toFa(Number(p).toLocaleString("en-US"));
const $=i=>document.getElementById(i);
const LS="pv_data_v14";
let db=JSON.parse(localStorage.getItem(LS) || '{"prods":{},"stores":{},"imgs":{}}');
if(!db.imgs) db.imgs = {};
if(Object.keys(db.stores).length === 0) { STORES_INIT.forEach(s => db.stores[s.id] = s); }
const save=()=>localStorage.setItem(LS, JSON.stringify(db));
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000)};

let V="p";
let currentImgId = null;
let currentItemId = null;

function fillSelects(){
  let cHtml = '<option value="">همه دسته‌ها</option>';
  [...new Set(D.map(r=>r.category))].filter(Boolean).sort().forEach(c=>{ cHtml+=`<option value="${c}">${c}</option>`});
  $("cat").innerHTML = cHtml;
  
  let cityHtml = '<option value="">همه شهرها</option>';
  [...new Set(Object.values(db.stores).map(s=>s.city))].filter(Boolean).sort().forEach(c=>{ cityHtml+=`<option value="${c}">${c}</option>`});
  $("city").innerHTML = cityHtml;
}

function render(){
  let html = "";
  const q = $("q").value.toLowerCase().trim();
  const selCat = $("cat").value;
  const selCity = $("city").value;
  
  if(V === "p"){
    let arr = D.map(d => ({...d, ...(db.prods[d.k]||{})}));
    if(selCat) arr = arr.filter(x => x.category === selCat);
    if(q) arr = arr.filter(x => (x.name + " " + (x.specs||'') + " " + (x.notes||'') + " " + x.category).toLowerCase().includes(q));
    
    if(arr.length === 0) { $("list").innerHTML = '<div style="text-align:center;padding:20px;color:gray">کالایی یافت نشد</div>'; return; }
    
    arr.forEach(p => {
      let pr = p.price > 0 ? `<div class="pr">${fmt(p.price)} <small>تومان</small></div>` : `<div class="np">ناموجود</div>`;
      let nt = (p.notes && !p.notes.includes("ناموجود")) ? `<div class="nt">${p.notes}</div>` : "";
      let sp = p.specs ? `<div class="sp">${p.specs}</div>` : "";
      let imgHtml = (p.imgs||[]).length ? `<div class="photos">${p.imgs.map(i=>`<img src="${db.imgs[i]}" onclick="window.open('${db.imgs[i]}')">`).join('')}</div>` : '';
      
      html += `<div class="c"><span class="cat">${p.category}</span><div class="nm">${p.name}</div>${sp}${nt}${pr}${imgHtml}
        <div class="bs">
          <button class="bt" onclick="openEdit('p','${p.k}')">ویرایش</button>
          <button class="bt" onclick="addPhoto('p','${p.k}')">📷 عکس</button>
          <button class="bt" onclick="alert('یادداشت‌ها: ${(p.c||[]).join(', ')}')">یادداشت (${(p.c||[]).length})</button>
        </div>
      </div>`;
    });
  } else {
    let arr = Object.values(db.stores);
    if(selCity) arr = arr.filter(x => x.city === selCity);
    if(q) arr = arr.filter(x => (x.n + " " + x.addr + " " + x.ph + " " + x.city).toLowerCase().includes(q));
    
    if(arr.length === 0) { $("list").innerHTML = '<div style="text-align:center;padding:20px;color:gray">مغازه‌ای یافت نشد</div>'; return; }
    
    arr.forEach(s => {
      let tel = s.ph ? `<a href="tel:${s.ph}" style="color:var(--ac);text-decoration:none">${toFa(s.ph)}</a>` : 'ثبت نشده';
      let map = s.addr ? `https://maps.google.com/?q=${encodeURIComponent(s.addr)}` : '';
      let rem = s.rem ? `<div class="nt" style="background:var(--dnb);color:var(--dn)">⏰ یادآوری: ${toFa(s.rem)}</div>` : '';
      let imgHtml = (s.imgs||[]).length ? `<div class="photos">${s.imgs.map(i=>`<img src="${db.imgs[i]}" onclick="window.open('${db.imgs[i]}')">`).join('')}</div>` : '';
      
      html += `<div class="c"><span class="cat">${s.type} - ${s.city||''}</span><div class="nm">${s.n}</div>
        <div class="ln">📞 ${tel}</div>
        <div class="ln">📍 ${s.addr||''}</div>
        ${rem}
        ${imgHtml}
        <div class="bs">
          ${map ? `<button class="bt" onclick="window.open('${map}','_blank')">🗺️ مسیریابی</button>` : ''}
          <button class="bt" onclick="openEdit('s','${s.id}')">ویرایش</button>
          <button class="bt" onclick="addPhoto('s','${s.id}')">📷 عکس</button>
        </div>
      </div>`;
    });
  }
  $("list").innerHTML = html;
}

window.openEdit = (type, id) => {
  $("m-title").textContent = id ? "ویرایش" : "افزودن جدید";
  $("m-id").value = id;
  currentItemId = id;
  
  if(type === 'p') {
    $("p-fields").style.display = "block"; $("s-fields").style.display = "none";
    let p = id ? {...D.find(d=>d.k===id), ...(db.prods[id]||{})} : {};
    $("m-n").value = p.name||""; $("m-c").value = p.category||""; $("m-pr").value = p.price||""; $("m-sp").value = p.specs||""; $("m-nt").value = p.notes||"";
  } else {
    $("p-fields").style.display = "none"; $("s-fields").style.display = "block";
    let s = id ? db.stores[id] : {};
    $("s-n").value = s.n||""; $("s-city").value = s.city||""; $("s-addr").value = s.addr||""; $("s-ph").value = s.ph||""; $("s-st").value = s.st||"جدید"; $("s-rem").value = s.rem||"";
  }
  $("modal-add").classList.remove("hide");
};

window.saveItem = () => {
  let id = $("m-id").value;
  if(V === "p") {
    let data = { name: $("m-n").value, category: $("m-c").value, price: parseInt($("m-pr").value)||0, specs: $("m-sp").value, notes: $("m-nt").value };
    if(!id) id = "p_"+Date.now();
    db.prods[id] = data;
  } else {
    let data = { n: $("s-n").value, city: $("s-city").value, addr: $("s-addr").value, ph: $("s-ph").value, st: $("s-st").value, rem: $("s-rem").value, type: "فروشگاه" };
    if(!id) id = "s_"+Date.now();
    db.stores[id] = data;
  }
  save(); fillSelects(); render(); $("modal-add").classList.add("hide");
  toast("ذخیره شد");
};

window.addPhoto = (type, id) => {
  currentImgId = id;
  $("fimg").click();
};

$("fimg").onchange = (e) => {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const imgId = "img_"+Date.now();
    db.imgs[imgId] = ev.target.result;
    
    if(V === "p") {
      if(!db.prods[currentImgId]) db.prods[currentImgId] = {};
      if(!db.prods[currentImgId].imgs) db.prods[currentImgId].imgs = [];
      db.prods[currentImgId].imgs.push(imgId);
    } else {
      if(!db.stores[currentImgId].imgs) db.stores[currentImgId].imgs = [];
      db.stores[currentImgId].imgs.push(imgId);
    }
    save(); render(); toast("عکس اضافه شد");
  };
  reader.readAsDataURL(file);
  e.target.value = "";
};

$("tp").onclick=()=>{ V="p"; $("tp").classList.add("on"); $("tl").classList.remove("on"); $("cat").style.display="block"; $("city").style.display="none"; render(); };
$("tl").onclick=()=>{ V="s"; $("tl").classList.add("on"); $("tp").classList.remove("on"); $("cat").style.display="none"; $("city").style.display="block"; render(); };
["q","cat","city"].forEach(id => $(id).addEventListener("input", render));

$("ad").onclick = () => openEdit(V === "p" ? 'p' : 's', null);

// ================= دانلود بکاپ و اکسل (اصلاح شده برای آیفون) =================
$("st").onclick = () => {
    const dataStr = JSON.stringify(db, null, 2);
    const blob = new Blob([dataStr], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = "pious_backup.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast("دانلود بکاپ آغاز شد");
};

$("temp").onclick = () => {
    const csvContent = "نام مغازه,شهر,آدرس,تلفن,نوع\nفروشگاه نمونه,مشهد,خیابان احمدآباد,09150000000,فروشگاه";
    const blob = new Blob(["\ufeff" + csvContent], {type: "text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = "template_stores.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast("قالب دانلود شد");
};

// ================= آپدیت هوشمند از اکسل =================
$("imp").onclick = () => $("fcsv").click();
$("fcsv").onchange = e => {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    let text = ev.target.result;
    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length < 2) { toast("فایل خالی است"); return; }
    
    let added = 0;
    if(V === "s") {
      let headers = lines[0].split(",").map(h => h.trim().replace(/['"]/g, '').replace('\ufeff','').toLowerCase());
      
      let nameIdx = headers.findIndex(h => h.includes("نام") || h.includes("name") || h.includes("مغازه"));
      let cityIdx = headers.findIndex(h => h.includes("شهر") || h.includes("city"));
      let addrIdx = headers.findIndex(h => h.includes("آدرس") || h.includes("نشانی") || h.includes("addr"));
      let phIdx = headers.findIndex(h => h.includes("تلفن") || h.includes("شماره") || h.includes("ph"));
      let typeIdx = headers.findIndex(h => h.includes("نوع") || h.includes("توضیح") || h.includes("type"));

      if(nameIdx === -1) nameIdx = 0; if(cityIdx === -1) cityIdx = 1; if(addrIdx === -1) addrIdx = 2; if(phIdx === -1) phIdx = 3;

      for(let i=1; i<lines.length; i++) {
        let cols = []; let cur = "", inQ = false;
        for(let ch of lines[i]) {
          if(ch === '"') { inQ = !inQ; continue; }
          if(ch === ',' && !inQ) { cols.push(cur.trim()); cur=""; } else { cur += ch; }
        }
        cols.push(cur.trim());

        if(cols.length <= nameIdx) continue;
        let name = cols[nameIdx];
        if(!name) continue;

        const id = "imp_s_" + Date.now() + "_" + i;
        db.stores[id] = { id, n: name, city: cols[cityIdx] || "نامشخص", addr: cols[addrIdx] || "", ph: cols[phIdx] || "", type: (typeIdx > -1 && cols[typeIdx]) ? cols[typeIdx] : "فروشگاه", st: "جدید" };
        added++;
      }
      if(added > 0) { save(); fillSelects(); render(); toast(added + " مغازه اضافه شد"); }
      else { toast("داده معتبری یافت نشد"); }
    } else {
      toast("برای کالاها، از دکمه + استفاده کنید");
    }
  };
  reader.readAsText(file, "UTF-8");
  e.target.value = "";
};

// مقداردهی
fillSelects();
render();
</script>
