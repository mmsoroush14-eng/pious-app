<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>ویزیتوری پایس</title>
<style>
:root { --bg:#f0f4f8; --card:#fff; --tx:#1e293b; --mu:#64748b; --bd:#e2e8f0; --ac:#0a8fc4; --ac-grad:linear-gradient(135deg,#0f172a,#1e293b); --pr:#059669; --dn:#dc2626; --dnb:#fee2e2; --sh:0 4px 15px rgba(0,0,0,.05); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f172a; --card:#1e293b; --tx:#f8fafc; --mu:#94a3b8; --bd:#334155; --ac:#38bdf8; --ac-grad:linear-gradient(135deg,#0f172a,#334155); --pr:#10b981; --dn:#f87171; --dnb:#7f1d1d; --sh:0 4px 15px rgba(0,0,0,.3); } }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:var(--bg); color:var(--tx); font-family:-apple-system,"Vazirmatn","Segoe UI",Tahoma,sans-serif; font-size:14px; padding-bottom:20px; padding-top:env(safe-area-inset-top); }
header { position:sticky; top:0; z-index:10; background:var(--ac-grad); padding:12px; border-radius:0 0 20px 20px; color:#fff; box-shadow:0 4px 12px rgba(0,0,0,.2); }
h1 { font-size:16px; margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; font-weight:800; }
span.st { font-size:11px; background:rgba(255,255,255,.15); padding:2px 8px; border-radius:10px; font-weight:500; }
.tabs { display:flex; gap:5px; margin-bottom:10px; background:rgba(255,255,255,.1); padding:4px; border-radius:10px; }
.tab { flex:1; padding:8px; border:none; border-radius:8px; font-weight:bold; background:transparent; color:#cbd5e1; font-size:13px; transition:.3s; }
.tab.on { background:#fff; color:#0f172a; box-shadow:0 2px 5px rgba(0,0,0,.1); }
.row { display:flex; gap:6px; margin-bottom:8px; }
input,select,button { font-family:inherit; font-size:13px; padding:10px; border-radius:8px; border:1px solid var(--bd); width:100%; outline:none; }
input:focus, select:focus { border-color:var(--ac); }
button { cursor:pointer; font-weight:bold; border:none; }
.btn-add { background:#fff; color:#0f172a; width:auto; padding:8px 12px; white-space:nowrap; border-radius:8px; font-size:13px; }
.btn-imp { background:rgba(255,255,255,.2); color:#fff; width:auto; padding:8px 12px; font-size:16px; }
#list { padding:12px; display:grid; gap:12px; }
.c { background:var(--card); border-radius:12px; padding:14px; box-shadow:var(--sh); border-top:4px solid var(--ac); position:relative; }
.cat { font-size:10px; color:var(--ac); background:#e0f2fe; padding:2px 8px; border-radius:6px; font-weight:bold; }
.nm { font-size:15px; font-weight:bold; margin:10px 0 6px; }
.cd { font-size:11px; color:var(--mu); font-family:monospace; direction:ltr; text-align:right;}
.pr { font-size:18px; font-weight:900; color:var(--pr); margin-top:8px; display:flex; align-items:baseline; gap:5px;}
.pr small { font-size:12px; color:var(--mu); font-weight:500; }
.np { color:var(--dn); background:var(--dnb); font-weight:bold; padding:6px 10px; border-radius:6px; display:inline-block; margin-top:8px; font-size:12px; }
.ln { font-size:13px; color:var(--mu); margin-top:6px; display:flex; align-items:center; gap:5px;}
.nt { font-size:12px; background:var(--bg); padding:8px; border-radius:8px; margin-top:10px; color:var(--mu);}
.bs { display:flex; gap:6px; margin-top:12px; }
.bt { flex:1; padding:8px; font-size:12px; background:var(--bg); border:1px solid var(--bd); border-radius:8px; color:var(--tx); }
.bt.p { background:var(--ac); color:#fff; border:none; }
.hide { display:none!important; }
#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1e293b; color:#fff; padding:10px 20px; border-radius:20px; font-size:12px; opacity:0; transition:.3s; z-index:100; pointer-events:none; font-weight:bold;}
#toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>💧 ویزیتوری پایس <span class="st" id="st">ذخیره محلی</span></h1>
  <div class="tabs">
    <button class="tab on" id="tp">کالاها</button>
    <button class="tab" id="tl">مغازه‌ها</button>
    <button class="btn-add" id="ad">+ جدید</button>
  </div>
  <div class="row">
    <input id="q" type="search" placeholder="جستجوی نام، کد، شهر یا آدرس...">
    <button class="btn-imp" id="imp" title="آپلود فایل اکسل">📥</button>
  </div>
  <div class="row">
    <select id="cat"><option value="">همه دسته‌ها</option></select>
    <select id="city" class="hide"><option value="">همه شهرها</option></select>
  </div>
</header>

<input type="file" id="fcsv" accept=".csv" hidden>
<div id="toast"></div>
<div id="list"></div>

<script>
// ================= دیتابیس محصولات =================
const D = [{"category":"دستگاه های کلاسیک (هوزینگی)","name":"پایس پیور* (اقتصادی)","code":"","specs":"شاسی پلاستیکی با مخزن 3.2 گالن وارداتی | پمپ LEFOO (روتور کوچک)","price":18950000,"notes":"در مدل پیور سه راهی و شیر ورودی از نوع پلاستیکی است","k":"3fe67dfa"},{"category":"دستگاه های کلاسیک (هوزینگی)","name":"پایس استار","code":"","specs":"شاسی پلاستیکی با مخزن 3.2 گالن وارداتی | هوزینگ ها ارگانیک تایوان","price":24750000,"notes":"","k":"70c37249"},{"category":"دستگاه های کیسی","name":"الگانس","code":"","specs":"دستگاه با کیس ABS مات | پمپ لیفو","price":25500000,"notes":"","k":"63b66648"},{"category":"دستگاه های نیمه صنعتی","name":"دستگاه 400 گالن","code":"","specs":"پمپ 36 ولت لیفو، ترانس 5 آمپر","price":59750000,"notes":"","k":"3892a7f4"},{"category":"پمپ","name":"پمپ لیفو روتور کوچک 75 گالن","code":"","specs":"","price":4350000,"notes":"","k":"1e6c8940"},{"category":"ترانس","name":"ترانس 24 ولت - 3 آمپر برند جتفلو","code":"","specs":"","price":0,"notes":"ناموجود","k":"de727c17"},{"category":"فیلتر - فیلترهای عمومی","name":"فیلتر مرحله یک 100 گرم","code":"","specs":"","price":0,"notes":"ناموجود","k":"81b49087"},{"category":"اتصالات (QFIT چین)","name":"زانو پمپ رزوه 3/8 به شیلنگ 1/4","code":"","specs":"","price":18000,"notes":"","k":"ba7a4361"}];

// ================= دیتابیس مغازه‌ها =================
const STORES_INIT = [
  {id:"t1", n:"تأمین‌کننده تجهیزات تصفیه آب تهرانپارس", type:"تأمین‌کننده", city:"تهران", addr:"تهران، منطقه ۴، خیابان ۱۹۶ شرقی", ph:"", st:"جدید"},
  {id:"t2", n:"فروشگاه تصفیه آب H2O", type:"فروشگاه", city:"تهران", addr:"تهران، شهرک شهید بهشتی", ph:"02177105649", st:"جدید"},
  {id:"t3", n:"تکنو آب تهران", type:"فروشگاه", city:"تهران", addr:"تهران، خیابان جمالزاده جنوبی", ph:"02166569129", st:"جدید"},
  {id:"m1", n:"کلینیک تخصصی تصفیه آب گوارا", type:"مرکز تخصصی", city:"مشهد", addr:"مشهد، میدان شهدا، پاساژ امین", ph:"05137127871", st:"جدید"},
  {id:"m2", n:"شرکت بازرگانی آبنوش", type:"تأمین‌کننده", city:"مشهد", addr:"مشهد، خیابان آبکوه، نبش آبکوه ۲۱", ph:"0513768003", st:"جدید"},
  {id:"i1", n:"دفتر نمایندگی ثمین آب", type:"فروشگاه", city:"اصفهان", addr:"اصفهان، خیابان طیب", ph:"03132222223", st:"جدید"},
  {id:"s1", n:"تصفیه آب میرآب سان پارس", type:"فروشگاه", city:"شیراز", addr:"شیراز، خیابان فلسطین", ph:"07132341919", st:"جدید"},
  {id:"tb1", n:"تصفیه آب هیدرولایف", type:"فروشگاه", city:"تبریز", addr:"تبریز، میدان قطب", ph:"04133359608", st:"جدید"},
  {id:"k1", n:"آبین پلاس", type:"فروشگاه", city:"کرج", addr:"کرج، بلوار دانش‌آموز", ph:"09150444148", st:"جدید"},
  {id:"q1", n:"تصفیه آب اردهال", type:"فروشگاه", city:"قم", addr:"قم، جاده اصفهان", ph:"02532860013", st:"جدید"}
];

// ================= منطق =================
const fa="۰۱۲۳۴۵۶۷۸۹"; const toFa=s=>String(s).replace(/\d/g,d=>fa[d]);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=p=>toFa(Number(p).toLocaleString("en-US"));
const $=i=>document.getElementById(i);
const LS="pv_data_v10";
let db=JSON.parse(localStorage.getItem(LS) || '{"prods":{},"stores":{}}');
if(Object.keys(db.stores).length === 0) { STORES_INIT.forEach(s => db.stores[s.id] = s); }
const save=()=>localStorage.setItem(LS, JSON.stringify(db));
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000)};

let V="p";

// این تابع فقط یکبار در ابتدا و هنگام آپدیت صدا زده می‌شود تا انتخاب‌ها ریست نشوند
function fillSelects(){
  let cHtml = '<option value="">همه دسته‌ها</option>';
  [...new Set(D.map(r=>r.category))].filter(Boolean).sort().forEach(c=>{ cHtml+=`<option value="${c}">${c}</option>`});
  $("cat").innerHTML = cHtml;
  
  let cityHtml = '<option value="">همه شهرها</option>';
  [...new Set(Object.values(db.stores).map(s=>s.city))].filter(Boolean).sort().forEach(c=>{ cityHtml+=`<option value="${c}">${c}</option>`});
  $("city").innerHTML = cityHtml;
}

function render(){
  let html = "";
  const q = $("q").value.toLowerCase().trim();
  const selCat = $("cat").value;
  const selCity = $("city").value;
  
  if(V === "p"){
    let arr = D.map(d => ({...d, ...(db.prods[d.k]||{})}));
    if(selCat) arr = arr.filter(x => x.category === selCat);
    if(q) arr = arr.filter(x => (x.name + " " + x.specs + " " + (x.notes||'') + " " + x.category).toLowerCase().includes(q));
    
    if(arr.length === 0) { $("list").innerHTML = '<div style="text-align:center;padding:20px;color:gray">کالایی یافت نشد</div>'; return; }
    
    arr.forEach(p => {
      let pr = p.price > 0 ? `<div class="pr">${fmt(p.price)} <small>تومان</small></div>` : `<div class="np">ناموجود / بدون قیمت</div>`;
      let nt = (p.notes && !p.notes.includes("ناموجود")) ? `<div class="nt">${p.notes}</div>` : "";
      html += `<div class="c"><span class="cat">${p.category}</span><div class="nm">${p.name}</div>${nt}${pr}</div>`;
    });
  } else {
    let arr = Object.values(db.stores);
    if(selCity) arr = arr.filter(x => x.city === selCity);
    if(q) arr = arr.filter(x => (x.n + " " + x.addr + " " + x.ph + " " + x.city).toLowerCase().includes(q));
    
    if(arr.length === 0) { $("list").innerHTML = '<div style="text-align:center;padding:20px;color:gray">مغازه‌ای یافت نشد</div>'; return; }
    
    arr.forEach(s => {
      let tel = s.ph ? `<a href="tel:${s.ph}" style="color:var(--ac);text-decoration:none">${toFa(s.ph)}</a>` : 'ثبت نشده';
      let map = s.addr ? `https://maps.google.com/?q=${encodeURIComponent(s.addr)}` : '';
      html += `<div class="c"><span class="cat">${s.type} - ${s.city||''}</span><div class="nm">${s.n}</div>
        <div class="ln">📞 ${tel}</div>
        <div class="ln">📍 ${s.addr||''}</div>
        <div class="bs">${map ? `<button class="bt" onclick="window.open('${map}','_blank')">🗺️ مسیریابی</button>` : ''}</div>
      </div>`;
    });
  }
  $("list").innerHTML = html;
}

$("tp").onclick=()=>{
  V="p"; $("tp").classList.add("on"); $("tl").classList.remove("on");
  $("cat").classList.remove("hide"); $("city").classList.add("hide");
  render();
};

$("tl").onclick=()=>{
  V="s"; $("tl").classList.add("on"); $("tp").classList.remove("on");
  $("cat").classList.add("hide"); $("city").classList.remove("hide");
  render();
};

// رویدادهای تغییر فیلترها
["q","cat","city"].forEach(id => $(id).addEventListener("input", render));

// ================= آپدیت هوشمند با فایل اکسل/CSV =================
$("imp").onclick = () => $("fcsv").click();
$("fcsv").onchange = e => {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    let text = ev.target.result;
    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length < 2) { toast("فایل خالی یا فاقد داده است"); return; }
    
    let added = 0;
    if(V === "s") {
      // استخراج هدرها و تبدیل به حروف کوچک برای جستجوی آسان‌تر
      let headers = lines[0].split(",").map(h => h.trim().replace(/['"]/g, '').replace('\ufeff','').toLowerCase());
      
      // پیدا کردن ایندکس (شماره ستون) هر فیلد بر اساس کلمات فارسی یا انگلیسی
      let nameIdx = headers.findIndex(h => h.includes("نام") || h.includes("name") || h.includes("مغازه"));
      let cityIdx = headers.findIndex(h => h.includes("شهر") || h.includes("city") || h.includes("شهرستان"));
      let addrIdx = headers.findIndex(h => h.includes("آدرس") || h.includes("نشانی") || h.includes("addr"));
      let phIdx = headers.findIndex(h => h.includes("تلفن") || h.includes("شماره") || h.includes("موبایل") || h.includes("ph") || h.includes("phone"));
      let typeIdx = headers.findIndex(h => h.includes("نوع") || h.includes("توضیح") || h.includes("type") || h.includes("desc"));

      // اگر هدر پیدا نشد، به صورت پیش‌فرض ستون‌های اول را در نظر بگیر
      if(nameIdx === -1) nameIdx = 0;
      if(cityIdx === -1) cityIdx = 1;
      if(addrIdx === -1) addrIdx = 2;
      if(phIdx === -1) phIdx = 3;

      // پیمایش ردیف‌ها (از ردیف دوم به بعد)
      for(let i=1; i<lines.length; i++) {
        // جداکننده هوشمند (حتی اگر داخل متن کاما وجود داشته باشد)
        let cols = [];
        let cur = "", inQ = false;
        for(let ch of lines[i]) {
          if(ch === '"') { inQ = !inQ; continue; }
          if(ch === ',' && !inQ) { cols.push(cur.trim()); cur=""; } 
          else { cur += ch; }
        }
        cols.push(cur.trim());

        if(cols.length <= nameIdx) continue;
        let name = cols[nameIdx];
        if(!name) continue;

        const id = "imp_" + Date.now() + "_" + i;
        db.stores[id] = {
          id, 
          n: name, 
          city: cols[cityIdx] || "نامشخص", 
          addr: cols[addrIdx] || "", 
          ph: cols[phIdx] || "", 
          type: (typeIdx > -1 && cols[typeIdx]) ? cols[typeIdx] : "فروشگاه", 
          st: "جدید"
        };
        added++;
      }
      if(added > 0) { 
        save(); 
        fillSelects(); // شهرهای جدید به منو اضافه شوند
        render(); 
        toast(added + " مغازه با موفقیت اضافه شد"); 
      }
      else { toast("داده معتبری برای افزودن یافت نشد"); }
    } else {
      toast("برای آپدیت قیمت‌ها، این فایل را در تب کالاها آپلود کنید (در نسخه بعدی)");
    }
  };
  reader.readAsText(file, "UTF-8");
  e.target.value = "";
};

// مقداردهی اولیه
fillSelects();
render();
</script>
</body>
</html>
