<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>ویزیتوری پایس</title>
<style>
:root { --bg:#f0f4f8; --card:#fff; --tx:#1e293b; --mu:#64748b; --bd:#e2e8f0; --ac:#0a8fc4; --ac-grad:linear-gradient(135deg,#0f172a,#1e293b); --pr:#059669; --dn:#dc2626; --dnb:#fee2e2; --sh:0 4px 15px rgba(0,0,0,.05); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f172a; --card:#1e293b; --tx:#f8fafc; --mu:#94a3b8; --bd:#334155; --ac:#38bdf8; --ac-grad:linear-gradient(135deg,#0f172a,#334155); --pr:#10b981; --dn:#f87171; --dnb:#7f1d1d; --sh:0 4px 15px rgba(0,0,0,.3); } }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:var(--bg); color:var(--tx); font-family:-apple-system,"Vazirmatn","Segoe UI",Tahoma,sans-serif; font-size:14px; padding-bottom:20px; padding-top:env(safe-area-inset-top); }
header { position:sticky; top:0; z-index:10; background:var(--ac-grad); padding:12px; border-radius:0 0 20px 20px; color:#fff; box-shadow:0 4px 12px rgba(0,0,0,.2); }
h1 { font-size:16px; margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; font-weight:800; }
span.st { font-size:11px; background:rgba(255,255,255,.15); padding:4px 10px; border-radius:10px; font-weight:500; cursor:pointer; display:flex; gap:4px; align-items:center;}
span.st:active { background:rgba(255,255,255,.3); }
.tabs { display:flex; gap:5px; margin-bottom:10px; background:rgba(255,255,255,.1); padding:4px; border-radius:10px; }
.tab { flex:1; padding:8px; border:none; border-radius:8px; font-weight:bold; background:transparent; color:#cbd5e1; font-size:13px; transition:.3s; }
.tab.on { background:#fff; color:#0f172a; box-shadow:0 2px 5px rgba(0,0,0,.1); }
.row { display:flex; gap:6px; margin-bottom:8px; }
input,select,button,textarea { font-family:inherit; font-size:13px; padding:10px; border-radius:8px; border:1px solid var(--bd); width:100%; outline:none; }
input:focus, select:focus, textarea:focus { border-color:var(--ac); }
button { cursor:pointer; font-weight:bold; border:none; }
.btn-add { background:#fff; color:#0f172a; width:auto; padding:8px 12px; white-space:nowrap; border-radius:8px; font-size:13px; }
.btn-icon { background:rgba(255,255,255,.2); color:#fff; width:auto; padding:8px 12px; font-size:16px; }
#list { padding:12px; display:grid; gap:12px; }
.c { background:var(--card); border-radius:12px; padding:14px; box-shadow:var(--sh); border-top:4px solid var(--ac); position:relative; }
.cat { font-size:10px; color:var(--ac); background:#e0f2fe; padding:2px 8px; border-radius:6px; font-weight:bold; }
.nm { font-size:15px; font-weight:bold; margin:10px 0 6px; }
.cd { font-size:11px; color:var(--mu); font-family:monospace; direction:ltr; text-align:right;}
.pr { font-size:18px; font-weight:900; color:var(--pr); margin-top:8px; display:flex; align-items:baseline; gap:5px;}
.pr small { font-size:12px; color:var(--mu); font-weight:500; }
.np { color:var(--dn); background:var(--dnb); font-weight:bold; padding:6px 10px; border-radius:6px; display:inline-block; margin-top:8px; font-size:12px; }
.ln { font-size:13px; color:var(--mu); margin-top:6px; display:flex; align-items:center; gap:5px;}
.nt { font-size:12px; background:var(--bg); padding:8px; border-radius:8px; margin-top:10px; color:var(--mu);}
.bs { display:flex; gap:6px; margin-top:12px; }
.bt { flex:1; padding:8px; font-size:12px; background:var(--bg); border:1px solid var(--bd); border-radius:8px; color:var(--tx); }
.bt.p { background:var(--ac); color:#fff; border:none; }
.bt.d { background:var(--dnb); color:var(--dn); border:none; }
.hide { display:none!important; }

/* فرم افزودن جدید */
#add-form { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(3px); }
#add-form .card { background:var(--card); width:100%; max-width:400px; border-radius:16px; padding:16px; display:grid; gap:10px; }
#add-form h3 { margin:0 0 10px; font-size:16px; text-align:center; }

#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1e293b; color:#fff; padding:10px 20px; border-radius:20px; font-size:12px; opacity:0; transition:.3s; z-index:100; pointer-events:none; font-weight:bold;}
#toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>💧 ویزیتوری پایس <span class="st" id="st" title="دانلود فایل پشتیبان">💾 بکاپ</span></h1>
  <div class="tabs">
    <button class="tab on" id="tp">کالاها</button>
    <button class="tab" id="tl">مغازه‌ها</button>
    <button class="btn-add" id="ad">+ جدید</button>
  </div>
  <div class="row">
    <input id="q" type="search" placeholder="جستجو...">
    <button class="btn-icon" id="temp" title="دانلود فایل اکسل خام">📄</button>
    <button class="btn-icon" id="imp" title="آپلود فایل اکسل">📥</button>
  </div>
  <div class="row">
    <select id="cat"><option value="">همه دسته‌ها</option></select>
    <select id="city" class="hide"><option value="">همه شهرها</option></select>
  </div>
</header>

<div id="add-form" class="hide">
  <div class="card">
    <h3>افزودن جدید</h3>
    <input id="n_n" placeholder="نام (مغازه یا کالا) *">
    <input id="n_c" placeholder="شهر (برای مغازه) / دسته (برای کالا) *">
    <input id="n_a" placeholder="آدرس (برای مغازه) / مشخصات (برای کالا)">
    <input id="n_p" placeholder="تلفن (برای مغازه) / قیمت (برای کالا)" inputmode="numeric">
    <div class="bs">
      <button class="bt p" onclick="saveNew()">ذخیره</button>
      <button class="bt" onclick="document.getElementById('add-form').classList.add('hide')">انصراف</button>
    </div>
  </div>
</div>

<input type="file" id="fcsv" accept=".csv" hidden>
<div id="toast"></div>
<div id="list"></div>

<script>
// ================= دیتابیس اولیه =================
const D = [
  {k:"p1", category:"دستگاه کلاسیک", name:"پایس پیور", price:18950000, notes:""},
  {k:"p2", category:"دستگاه کلاسیک", name:"پایس استار", price:24750000, notes:""},
  {k:"p3", category:"پمپ", name:"پمپ لیفو 75 گالن", price:4350000, notes:""}
];

const STORES_INIT = [
  // مشهد (افزایش یافت)
  {id:"m1", n:"کلینیک تخصصی تصفیه آب گوارا", type:"مرکز تخصصی", city:"مشهد", addr:"میدان شهدا، پاساژ امین", ph:"05137127871", st:"جدید"},
  {id:"m2", n:"شرکت بازرگانی آبنوش", type:"تأمین‌کننده", city:"مشهد", addr:"خیابان آبکوه، نبش آبکوه ۲۱", ph:"0513768003", st:"جدید"},
  {id:"m3", n:"خانه تصفیه آب مشهد", type:"فروشگاه", city:"مشهد", addr:"بلوار ساجدی، ساجدی یک", ph:"09926282475", st:"جدید"},
  {id:"m4", n:"صنایع تصفیه آب آبینه پلاس", type:"فروشگاه", city:"مشهد", addr:"بلوار الهیه، نبش الهیه ۲۷", ph:"05135133000", st:"جدید"},
  {id:"m5", n:"پیشگام تصفیه صنعت شرق", type:"تولیدکننده", city:"مشهد", addr:"شهرک صنعتی فناوری برتر", ph:"05132400001", st:"جدید"},
  {id:"m6", n:"تصفیه آب رضوان", type:"فروشگاه", city:"مشهد", addr:"احمدآباد، خیابان عارف ۹", ph:"05138451234", st:"جدید"},
  {id:"m7", n:"آب سازان مشهد", type:"تأمین‌کننده", city:"مشهد", addr:"بلوار وکیل آباد، نبش ۳۲", ph:"09151234567", st:"جدید"},
  {id:"m8", n:"فروشگاه آب حیات", type:"فروشگاه", city:"مشهد", addr:"خیابان طبرسی جنوبی", ph:"", st:"جدید"},
  {id:"m9", n:"مرکز پخش فیلتر مشهد", type:"پخش عمده", city:"مشهد", addr:"خیابان کوهسنگی", ph:"", st:"جدید"},
  
  // اصفهان (افزایش یافت)
  {id:"i1", n:"دفتر نمایندگی ثمین آب", type:"فروشگاه", city:"اصفهان", addr:"خیابان طیب، ساختمان مهتاب ۹", ph:"03132222223", st:"جدید"},
  {id:"i2", n:"فروشگاه تصفیه آب زلال", type:"فروشگاه", city:"اصفهان", addr:"خیابان غرضی، خیابان خردمند", ph:"09138291500", st:"جدید"},
  {id:"i3", n:"فروشگاه تصفیه آب گلدواتر", type:"فروشگاه", city:"اصفهان", addr:"بلوار ارتش", ph:"09134490357", st:"جدید"},
  {id:"i4", n:"زلال آب پارتاک", type:"تولیدکننده", city:"اصفهان", addr:"شهرک صنعتی المهدی", ph:"09133375200", st:"جدید"},
  {id:"i5", n:"نمایندگی فیلتر سرکان", type:"نمایندگی", city:"اصفهان", addr:"خیابان کاشانی جنوبی", ph:"", st:"جدید"},
  {id:"i6", n:"سپاهان آب", type:"فروشگاه", city:"اصفهان", addr:"خیابان چهارباغ بالا، کوچه ۱۴", ph:"03136661234", st:"جدید"},
  {id:"i7", n:"تصفیه آب زاینده رود", type:"فروشگاه", city:"اصفهان", addr:"بلوار کشاورز، جنب پمپ بنزین", ph:"09131112233", st:"جدید"},
  {id:"i8", n:"مرکز پخش تجهیزات اصفهان", type:"پخش عمده", city:"اصفهان", addr:"خیابان جهاد", ph:"", st:"جدید"},

  // تهران
  {id:"t1", n:"تأمین‌کننده تجهیزات تهرانپارس", type:"تأمین‌کننده", city:"تهران", addr:"منطقه ۴، خیابان ۱۹۶ شرقی", ph:"", st:"جدید"},
  {id:"t2", n:"فروشگاه تصفیه آب H2O", type:"فروشگاه", city:"تهران", addr:"شهرک شهید بهشتی", ph:"02177105649", st:"جدید"},
  {id:"t3", n:"تکنو آب تهران", type:"فروشگاه", city:"تهران", addr:"خیابان جمالزاده جنوبی", ph:"02166569129", st:"جدید"}
];

// ================= منطق =================
const fa="۰۱۲۳۴۵۶۷۸۹"; const toFa=s=>String(s).replace(/\d/g,d=>fa[d]);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=p=>toFa(Number(p).toLocaleString("en-US"));
const $=i=>document.getElementById(i);
const LS="pv_data_v11";
let db=JSON.parse(localStorage.getItem(LS) || '{"prods":{},"stores":{}}');
if(Object.keys(db.stores).length === 0) { STORES_INIT.forEach(s => db.stores[s.id] = s); }
const save=()=>localStorage.setItem(LS, JSON.stringify(db));
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000)};

let V="p";

function fillSelects(){
  let cHtml = '<option value="">همه دسته‌ها</option>';
  [...new Set(D.map(r=>r.category))].filter(Boolean).sort().forEach(c=>{ cHtml+=`<option value="${c}">${c}</option>`});
  $("cat").innerHTML = cHtml;
  
  let cityHtml = '<option value="">همه شهرها</option>';
  [...new Set(Object.values(db.stores).map(s=>s.city))].filter(Boolean).sort().forEach(c=>{ cityHtml+=`<option value="${c}">${c}</option>`});
  $("city").innerHTML = cityHtml;
}

function render(){
  let html = "";
  const q = $("q").value.toLowerCase().trim();
  const selCat = $("cat").value;
  const selCity = $("city").value;
  
  if(V === "p"){
    let arr = D.map(d => ({...d, ...(db.prods[d.k]||{})}));
    if(selCat) arr = arr.filter(x => x.category === selCat);
    if(q) arr = arr.filter(x => (x.name + " " + x.specs + " " + (x.notes||'') + " " + x.category).toLowerCase().includes(q));
    
    if(arr.length === 0) { $("list").innerHTML = '<div style="text-align:center;padding:20px;color:gray">کالایی یافت نشد</div>'; return; }
    
    arr.forEach(p => {
      let pr = p.price > 0 ? `<div class="pr">${fmt(p.price)} <small>تومان</small></div>` : `<div class="np">ناموجود</div>`;
      let nt = (p.notes && !p.notes.includes("ناموجود")) ? `<div class="nt">${p.notes}</div>` : "";
      html += `<div class="c"><span class="cat">${p.category}</span><div class="nm">${p.name}</div>${nt}${pr}</div>`;
    });
  } else {
    let arr = Object.values(db.stores);
    if(selCity) arr = arr.filter(x => x.city === selCity);
    if(q) arr = arr.filter(x => (x.n + " " + x.addr + " " + x.ph + " " + x.city).toLowerCase().includes(q));
    
    if(arr.length === 0) { $("list").innerHTML = '<div style="text-align:center;padding:20px;color:gray">مغازه‌ای یافت نشد</div>'; return; }
    
    arr.forEach(s => {
      let tel = s.ph ? `<a href="tel:${s.ph}" style="color:var(--ac);text-decoration:none">${toFa(s.ph)}</a>` : 'ثبت نشده';
      let map = s.addr ? `https://maps.google.com/?q=${encodeURIComponent(s.addr)}` : '';
      html += `<div class="c"><span class="cat">${s.type} - ${s.city||''}</span><div class="nm">${s.n}</div>
        <div class="ln">📞 ${tel}</div>
        <div class="ln">📍 ${s.addr||''}</div>
        <div class="bs">${map ? `<button class="bt" onclick="window.open('${map}','_blank')">🗺️ مسیریابی</button>` : ''}</div>
      </div>`;
    });
  }
  $("list").innerHTML = html;
}

$("tp").onclick=()=>{ V="p"; $("tp").classList.add("on"); $("tl").classList.remove("on"); $("cat").classList.remove("hide"); $("city").classList.add("hide"); render(); };
$("tl").onclick=()=>{ V="s"; $("tl").classList.add("on"); $("tp").classList.remove("on"); $("cat").classList.add("hide"); $("city").classList.remove("hide"); render(); };
["q","cat","city"].forEach(id => $(id).addEventListener("input", render));

// ================= دکمه + جدید (فرم) =================
$("ad").onclick = () => {
    $("n_n").value = ""; $("n_c").value = ""; $("n_a").value = ""; $("n_p").value = "";
    if(V === "p") {
        $("n_c").placeholder = "دسته بندی (مثلاً: پمپ) *";
        $("n_a").placeholder = "مشخصات فنی";
        $("n_p").placeholder = "قیمت (تومان)";
    } else {
        $("n_c").placeholder = "شهر (مثلاً: مشهد) *";
        $("n_a").placeholder = "آدرس کامل";
        $("n_p").placeholder = "شماره تلفن";
    }
    $("add-form").classList.remove("hide");
};

window.saveNew = () => {
    let n = $("n_n").value.trim();
    let c = $("n_c").value.trim();
    let a = $("n_a").value.trim();
    let p = $("n_p").value.trim();
    if(!n || !c) { toast("نام و دسته/شهر الزامی است"); return; }
    
    if(V === "p") {
        const id = "manual_p_" + Date.now();
        db.prods[id] = { k: id, name: n, category: c, specs: a, price: parseInt(p) || 0 };
    } else {
        const id = "manual_s_" + Date.now();
        db.stores[id] = { id: id, n: n, city: c, addr: a, ph: p, type: "فروشگاه", st: "جدید" };
    }
    save(); fillSelects(); render(); $("add-form").classList.add("hide");
    toast("با موفقیت اضافه شد");
};

// ================= بکاپ گیری (دکمه بالای صفحه) =================
$("st").onclick = () => {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
    const dlAnchorElem = document.createElement('a');
    dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", "pious_backup.json");
    dlAnchorElem.click();
    toast("فایل بکاپ دانلود شد");
};

// ================= دانلود قالب اکسل =================
$("temp").onclick = () => {
    const csvContent = "data:text/csv;charset=utf-8,\uFEFFنام مغازه,شهر,آدرس,تلفن,نوع\n" +
                       "فروشگاه نمونه,مشهد,خیابان احمدآباد,09150000000,فروشگاه\n" +
                       "پخش نمونه,تهران,خیابان ولیعصر,02112345678,پخش عمده";
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "template_stores.csv");
    document.body.appendChild(link);
    link.click();
    toast("قالب اکسل دانلود شد");
};

// ================= آپدیت هوشمند از اکسل =================
$("imp").onclick = () => $("fcsv").click();
$("fcsv").onchange = e => {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    let text = ev.target.result;
    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length < 2) { toast("فایل خالی یا فاقد داده است"); return; }
    
    let added = 0;
    if(V === "s") {
      let headers = lines[0].split(",").map(h => h.trim().replace(/['"]/g, '').replace('\ufeff','').toLowerCase());
      
      let nameIdx = headers.findIndex(h => h.includes("نام") || h.includes("name") || h.includes("مغازه"));
      let cityIdx = headers.findIndex(h => h.includes("شهر") || h.includes("city"));
      let addrIdx = headers.findIndex(h => h.includes("آدرس") || h.includes("نشانی") || h.includes("addr"));
      let phIdx = headers.findIndex(h => h.includes("تلفن") || h.includes("شماره") || h.includes("ph"));
      let typeIdx = headers.findIndex(h => h.includes("نوع") || h.includes("توضیح") || h.includes("type"));

      if(nameIdx === -1) nameIdx = 0;
      if(cityIdx === -1) cityIdx = 1;
      if(addrIdx === -1) addrIdx = 2;
      if(phIdx === -1) phIdx = 3;

      for(let i=1; i<lines.length; i++) {
        let cols = []; let cur = "", inQ = false;
        for(let ch of lines[i]) {
          if(ch === '"') { inQ = !inQ; continue; }
          if(ch === ',' && !inQ) { cols.push(cur.trim()); cur=""; } 
          else { cur += ch; }
        }
        cols.push(cur.trim());

        if(cols.length <= nameIdx) continue;
        let name = cols[nameIdx];
        if(!name) continue;

        const id = "imp_s_" + Date.now() + "_" + i;
        db.stores[id] = {
          id, n: name, 
          city: cols[cityIdx] || "نامشخص", 
          addr: cols[addrIdx] || "", 
          ph: cols[phIdx] || "", 
          type: (typeIdx > -1 && cols[typeIdx]) ? cols[typeIdx] : "فروشگاه", 
          st: "جدید"
        };
        added++;
      }
      if(added > 0) { save(); fillSelects(); render(); toast(added + " مغازه اضافه شد"); }
      else { toast("داده معتبری یافت نشد"); }
    } else {
      toast("برای کالاها فایل را در تب کالاها آپلود کنید (نسخه بعدی)");
    }
  };
  reader.readAsText(file, "UTF-8");
  e.target.value = "";
};

// مقداردهی
fillSelects();
render();
</script>
</body>
</html>
